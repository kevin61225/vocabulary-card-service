stages:
  - build
  - test
  - quality
  - docker
  - security

variables:
  DOTNET_VERSION: "10.0"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # Disable .NET welcome message and telemetry
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # NuGet package cache
  NUGET_PACKAGES_DIRECTORY: "$CI_PROJECT_DIR/.nuget"

# Cache .NET packages
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/

before_script:
  - echo "Starting CI/CD pipeline for $CI_COMMIT_REF_NAME"

# Build job
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - echo "Restoring dependencies..."
    - dotnet restore VocabularyCardService.sln
    - echo "Building solution..."
    - dotnet build VocabularyCardService.sln --configuration Release --no-restore
  artifacts:
    paths:
      - src/*/bin/
      - src/*/obj/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Test job
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  dependencies:
    - build
  script:
    - echo "Running tests..."
    - dotnet test VocabularyCardService.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger "junit;LogFilePath=test-results.xml"
  artifacts:
    when: always
    paths:
      - "**/test-results.xml"
      - "**/coverage.cobertura.xml"
    reports:
      junit: "**/test-results.xml"
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"
    expire_in: 1 week
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  only:
    - main
    - develop
    - merge_requests

# Code quality check
code-quality:
  stage: quality
  image: mcr.microsoft.com/dotnet/sdk:10.0
  dependencies:
    - build
  script:
    - echo "Running code quality checks..."
    - dotnet format VocabularyCardService.sln --verify-no-changes --verbosity diagnostic || true
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Docker build job
docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  dependencies:
    - build
  before_script:
    - docker info
  script:
    - echo "Building Docker image..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - echo "Logging in to GitLab Container Registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "Pushing Docker image..."
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  only:
    - main
    - develop

# Security scan with Trivy
security-scan:
  stage: security
  image: docker:24
  services:
    - docker:24-dind
  dependencies:
    - docker-build
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - echo "Logging in to GitLab Container Registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "Pulling Docker image for scanning..."
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - echo "Running Trivy security scan..."
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --severity HIGH,CRITICAL --format json --output trivy-report.json $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 1 week
    reports:
      container_scanning: trivy-report.json
  allow_failure: true
  only:
    - main
    - develop

# Deployment job (placeholder for future use)
deploy:
  stage: .post
  image: alpine:latest
  script:
    - echo "Deployment configuration will be added here"
    - echo "Image ready for deployment: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - main
  when: manual
